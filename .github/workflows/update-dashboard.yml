name: Atualizar Painel A7

on:
  schedule:
    - cron: '0 11,15,19,21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar dados e atualizar dashboard
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 update_data.py

      - name: Commit e push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: atualização Meta Ads $(date '+%Y-%m-%d %H:%M BRT')"
          git push
